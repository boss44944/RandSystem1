name: .NET 10 CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore RandSystem1.slnx
      - name: Build
        run: dotnet build RandSystem1.slnx --configuration Release --no-restore --warnaserror
      - name: Unit tests
        run: dotnet test RandSystem1.slnx --configuration Release --no-build --verbosity normal
